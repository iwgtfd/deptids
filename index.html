<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>紫荊不分系｜畢業資格審核與修課顧問（Beta）</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>

<body>
  <header class="topbar">
    <div class="container">
      <div class="brand">
        <div class="brand__title">🎓 紫荊不分系｜畢業資格審核與修課顧問</div>
      </div>
    </div>
  </header>

  <main class="container grid">
    <!-- 左欄：輸入 -->
    <section class="card">
      <h2 class="card__title">步驟 1｜匯入或貼上成績單</h2>

      <div class="field">
        <label class="label">上傳 PDF（尚未開放）</label>
        <input class="input" type="file" accept="application/pdf" disabled />
      </div>

      <div class="field">
        <label class="label">貼上成績單文字（格式：課程代碼/課程名稱[/學分]）</label>
        <textarea
          class="textarea"
          id="txtRaw"
          placeholder="例如：&#10;701234/世界文明經典閱讀（一）&#10;123456/資料結構/3"
        ></textarea>
      </div>

      <hr class="sep" />

      <h2 class="card__title">步驟 2｜選擇入學年度</h2>

      <div class="field">
        <div class="row">
          <label class="pill">
            <input type="radio" name="ruleYear" value="113" checked />
            113 入學
          </label>
          <label class="pill">
            <input type="radio" name="ruleYear" value="114" />
            114 入學
          </label>
        </div>

        <div class="row" style="margin-top:10px;">
          <label class="pill">
            <input type="radio" name="track114" id="trackA" value="A" disabled />
            114 甲組
          </label>
          <label class="pill">
            <input type="radio" name="track114" id="trackB" value="B" disabled />
            114 乙組
          </label>
        </div>
      </div>

      <hr class="sep" />

      <h2 class="card__title">步驟 3｜選擇專業註記</h2>

      <div class="field">
        <label class="label" for="specSelect">專業註記</label>

        <select class="select" id="specSelect">
          <option value="">（未選擇專業註記）</option>

          <!-- 已建規則 -->
          <option value="cs_minor">資訊工程學系</option>
          <option value="adult_ed_minor">成人及繼續教育學系</option>
          <option value="ba_minor">企業管理學系</option>
          <option value="labor_minor">勞工關係學系</option>
          <option value="crime_prevention_minor">犯罪防治學系</option>
          <option value="psych_minor">心理學系</option>
          <option value="comm_minor">傳播學系</option>

          <!-- 尚未建規則 -->
          <option disabled>──────── 尚未建規則 ────────</option>
          <option disabled>中國文學學系</option>
          <option disabled>外國語文學系</option>
          <option disabled>歷史學系</option>
          <option disabled>哲學系</option>
          <option disabled>數學系</option>
          <option disabled>生物醫學科學系</option>
          <option disabled>地球與環境科學系</option>
          <option disabled>化學暨生物學系</option>
          <option disabled>物理學系</option>
          <option disabled>政治學系</option>
          <option disabled>電機工程學系</option>
          <option disabled>機械工程學系</option>
          <option disabled>化學工程學系</option>
          <option disabled>通訊工程學系</option>
          <option disabled>經濟學系</option>
          <option disabled>財務金融學系</option>
          <option disabled>會計與資訊科技學系</option>
          <option disabled>資訊管理學系</option>
          <option disabled>法律學系</option>
          <option disabled>財經法律學系</option>
          <option disabled>運動競技學系</option>
        </select>
      </div>

      <hr class="sep" />

      <div class="row">
        <button class="btn btn--primary" id="btnRun" type="button">
          ⚡ 產生審核結果
        </button>
        <button class="btn" id="btnCopy" type="button">
          📋 複製報告
        </button>
      </div>
    </section>

    <!-- 右欄：結果 -->
    <section class="card">
      <h2 class="card__title">結果總覽</h2>

      <div class="kpi">
        <div class="kpi__card">
          <div class="kpi__num" id="kpiCredits">—</div>
          <div class="kpi__label">已取得學分</div>
        </div>
        <div class="kpi__card">
          <div class="kpi__num" id="kpiReq">—</div>
          <div class="kpi__label">共同必修完成</div>
        </div>
        <div class="kpi__card">
          <div class="kpi__num" id="kpiSpec">—</div>
          <div class="kpi__label">專業註記進度</div>
        </div>
      </div>

      <div class="block">
        <div class="block__title">學分進度</div>

        <div class="progress">
          <div class="progress__meta">
            <span>總學分</span>
            <span class="muted" id="metaTotal">0 / 128</span>
          </div>
          <div class="progress__bar">
            <div class="progress__fill" id="barTotal"></div>
          </div>

          <div class="progress__meta">
            <span>通識</span>
            <span class="muted" id="metaGE">0 / 28</span>
          </div>
          <div class="progress__bar">
            <div class="progress__fill" id="barGE"></div>
          </div>

          <div class="progress__meta">
            <span>共同必修</span>
            <span class="muted" id="metaReq">0 / —</span>
          </div>
          <div class="progress__bar">
            <div class="progress__fill" id="barReq"></div>
          </div>

          <div class="progress__meta">
            <span>自由選修</span>
            <span class="muted" id="metaFree">0 / 0</span>
          </div>
          <div class="progress__bar">
              <div class="progress__fill" id="barFree" style="width:0%"></div>
          </div>
        </div>
      </div>

      <div class="block">
        <div class="block__title">顧問報告</div>
        <pre class="report" id="reportText">(尚未產生)</pre>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container muted">
      本系統為輔助工具，實際畢業資格仍以系辦與教務系統審核為準。
    </div>
  </footer>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
